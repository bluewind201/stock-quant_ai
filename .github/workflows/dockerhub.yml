# Stock Quant AI 이미지 → Docker Hub(bluewind201/stock-quant) 자동 게시
#   - main 에 push(=PR 병합)       → :latest, :sha-<7자리>
#   - 태그 v* push                 → :<버전>, :<메이저.마이너>, :latest
#   - Actions 탭에서 수동 실행      → 입력한 version 태그(+ latest) 및 선택 플랫폼
# 필요한 저장소 시크릿: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN(Docker Hub Access Token, Read & Write)
# 운영 반영은 기존과 같다: docker compose pull && docker compose up -d
name: Docker Hub 게시

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "core/**"
      - "stock-web/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/dockerhub.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "추가로 붙일 버전 태그(예: 3.22.2). 비우면 latest 만"
        required: false
        default: ""
      platforms:
        description: "빌드 플랫폼 (기본 linux/amd64, 필요 시 멀티아키텍처 선택)"
        required: false
        default: "linux/amd64"
        type: choice
        options:
          - "linux/amd64"
          - "linux/amd64,linux/arm64"

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: bluewind201/stock-quant

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 태그 계산
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
