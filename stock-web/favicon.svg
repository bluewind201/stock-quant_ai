<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#050B14"/>
        <stop offset="50%" stop-color="#0F172A"/>
        <stop offset="100%" stop-color="#020617"/>
      </linearGradient>
      <linearGradient id="trend" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#10B981"/>
        <stop offset="50%" stop-color="#2DD4BF"/>
        <stop offset="100%" stop-color="#A855F7"/>
      </linearGradient>
      <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.75"/>
      </filter>
    </defs>
    <rect x="44" y="44" width="936" height="936" rx="220" fill="url(#bg)"/>
    <rect x="52" y="52" width="920" height="920" rx="212" fill="none" stroke="#2DD4BF" stroke-width="10" stroke-opacity="0.4"/>

    <!-- Candlesticks -->
    <g filter="url(#drop)">
      <line x1="268" y1="520" x2="268" y2="780" stroke="#38BDF8" stroke-width="18" stroke-linecap="round"/>
      <rect x="228" y="580" width="80" height="140" rx="20" fill="#38BDF8"/>

      <line x1="432" y1="410" x2="432" y2="710" stroke="#2DD4BF" stroke-width="18" stroke-linecap="round"/>
      <rect x="392" y="460" width="80" height="180" rx="20" fill="#2DD4BF"/>

      <line x1="596" y1="340" x2="596" y2="660" stroke="#10B981" stroke-width="18" stroke-linecap="round"/>
      <rect x="556" y="400" width="80" height="190" rx="20" fill="#10B981"/>

      <line x1="760" y1="220" x2="760" y2="560" stroke="#A855F7" stroke-width="18" stroke-linecap="round"/>
      <rect x="720" y="270" width="80" height="210" rx="20" fill="#A855F7"/>
    </g>

    <!-- AI Rising Trajectory Curve -->
    <path d="M180 730 L380 520 L536 608 L816 236" fill="none" stroke="url(#trend)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#drop)"/>
    <circle cx="816" cy="236" r="44" fill="#FDE047" stroke="#FFFFFF" stroke-width="12"/>
  </svg>